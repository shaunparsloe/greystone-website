name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Manual run: send every sitemap page to IndexNow (Bing and others); nothing is deployed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only site file types from website/; skip hidden folders (.claude/, .playwright-mcp/)
      # and anything else, such as *.md notes. Keep this list in step with the pre-commit hook.
      - name: Copy site files only
        run: |
          rsync -a --prune-empty-dirs \
            --exclude='.*/' --include='*/' \
            --include='CNAME' \
            --include='*.html' --include='*.css' --include='*.js' \
            --include='*.xml' --include='*.txt' \
            --include='*.jpg' --include='*.jpeg' --include='*.png' --include='*.webp' \
            --include='*.avif' --include='*.gif' --include='*.svg' --include='*.ico' \
            --include='*.woff2' \
            --exclude='*' \
            website/ _site/
          find _site -type f | sort
      # Write the CSS files into each published page, so the first paint doesn't wait for a stylesheet
      # download. Source pages keep their <link> tags; see tools/inline_css.py.
      - name: Inline CSS into pages
        run: python3 tools/inline_css.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (via IndexNow) which pages changed in this push, once the new site is live.
  indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          git diff --name-only "$BEFORE" "$AFTER" -- website/ > changed.txt || git ls-files website/ > changed.txt
          python3 tools/indexnow_submit.py $(cat changed.txt)

  indexnow-all:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit every sitemap page
        run: python3 tools/indexnow_submit.py --all
